[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-watcher"
version = "0.1.0"
description = "Local-first reading of any video, carousel or post into text, plus video compression and clip cutting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Krishan Raja" }]
keywords = ["video", "ffmpeg", "compression", "chatgpt", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
watch = [
  "faster-whisper==1.2.1",
  "numpy",
  "opencv-python-headless<5",
  "yt-dlp[default,deno]>=2026.10.21",
  "curl_cffi==0.16.0",
  "gallery-dl>=1.32.17",
  "instaloader==4.15.4",
  "youtube-transcript-api==1.2.4",
  "bgutil-ytdlp-pot-provider==2.0.2",
  "playwright",
]

[project.scripts]
video-compress = "video_compression.cli:entrypoint"
content-watch = "content_watcher.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/krishanraja/content-watcher"
Issues = "https://github.com/krishanraja/content-watcher/issues"

[tool.setuptools]
packages = ["video_compression", "content_watcher", "content_watcher.read", "content_watcher.fetch"]
